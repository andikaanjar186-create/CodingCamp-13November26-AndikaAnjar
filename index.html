<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="label">Total Balance</p>
        <h1 id="total">$ 0</h1>
      </div>
      <button id="themeToggle" class="ghost" aria-label="Toggle dark mode">Dark</button>
    </header>

    <section class="card">
      <h2>Add transaction</h2>
      <form id="form" novalidate>
        <input id="name" type="text" placeholder="Item name">
        <input id="amount" type="number" min="1" placeholder="Amount ($)">
        <select id="category"></select>
        <p id="error" class="error" role="alert"></p>
        <button type="submit" class="primary">Add transaction</button>
      </form>
      <div class="custom">
        <input id="newCategory" type="text" placeholder="New category">
        <button id="addCategory" class="ghost" type="button">Add category</button>
      </div>
    </section>

    <section class="card">
      <h2>Spending by category</h2>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
      <p id="chartEmpty" class="empty">No spending yet. Add a transaction to see the chart.</p>
    </section>

    <section class="card">
      <div class="list-head">
        <h2>Transactions</h2>
        <select id="sort" aria-label="Sort transactions">
          <option value="newest">Newest</option>
          <option value="amount-desc">Amount: high to low</option>
          <option value="amount-asc">Amount: low to high</option>
          <option value="category">Category</option>
        </select>
      </div>
      <ul id="list" class="list"></ul>
      <p id="listEmpty" class="empty">No transactions yet.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
